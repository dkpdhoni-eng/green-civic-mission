<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificate Verification</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:linear-gradient(135deg,#dff5df,#eefbea);

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    font-family:'Poppins',sans-serif;

    padding:20px;

}

.verify-box{

    width:700px;

    background:white;

    border-radius:25px;

    padding:50px;

    text-align:center;

    box-shadow:0 0 30px rgba(0,0,0,0.15);

    border:6px solid #16a34a;

}

.verify-box img{

    width:120px;

    margin-bottom:20px;

}

.verify-box h1{

    color:#16a34a;

    font-size:52px;

    margin-bottom:15px;

}

.verify-box h2{

    color:#0b5d1e;

    margin-top:25px;

    font-size:36px;

}

.verify-box p{

    font-size:22px;

    margin-top:18px;

    color:#333;

    line-height:1.8;

}

.verified{

    margin-top:30px;

    font-size:28px;

    color:#16a34a;

    font-weight:700;

}

</style>

</head>

<body>

<div class="verify-box">

<img src="logo.png">

<h1>
✅ Certificate Verified
</h1>

<p>

This certificate has been officially verified by

</p>

<h2>
Green Civic Mission 🌱
</h2>

<p>

Volunteer Name: Rahul Sharma <br><br>

Certificate ID: GCM2026/1025 <br><br>

Status: Valid Certificate

</p>

<div class="verified">

✔ Verified Successfully

</div>

</div>

</body>

</html>

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificate Verification</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:linear-gradient(135deg,#dff5df,#eefbea);

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    padding:20px;

    font-family:'Poppins',sans-serif;

}

.verify-box{

    width:750px;

    background:white;

    border-radius:30px;

    padding:60px;

    text-align:center;

    box-shadow:0 0 30px rgba(0,0,0,0.15);

    border:8px solid #16a34a;

    position:relative;

    overflow:hidden;

}

/* DECORATION */

.verify-box::before{

    content:"";

    position:absolute;

    top:-120px;
    left:-120px;

    width:300px;
    height:300px;

    background:linear-gradient(135deg,#0b5d1e,#2ecc71);

    border-radius:50%;

    opacity:0.9;

}

.verify-box::after{

    content:"";

    position:absolute;

    bottom:-140px;
    right:-140px;

    width:320px;
    height:320px;

    background:linear-gradient(135deg,#2ecc71,#0b5d1e);

    border-radius:50%;

    opacity:0.9;

}

.logo{

    width:120px;

    position:relative;

    z-index:2;

}

h1{

    color:#16a34a;

    font-size:52px;

    margin-top:15px;

    position:relative;

    z-index:2;

}

.org{

    font-size:34px;

    color:#0b5d1e;

    margin-top:10px;

    font-weight:700;

    position:relative;

    z-index:2;

}

.info{

    margin-top:40px;

    position:relative;

    z-index:2;

}

.info p{

    font-size:24px;

    margin:18px 0;

    color:#333;

    line-height:1.8;

}

.info span{

    color:#0b5d1e;

    font-weight:700;

}

.verified{

    margin-top:35px;

    font-size:30px;

    color:#16a34a;

    font-weight:700;

    position:relative;

    z-index:2;

}

.footer{

    margin-top:30px;

    color:#666;

    font-size:18px;

    position:relative;

    z-index:2;

}

</style>

</head>

<body>

<div class="verify-box">

<img src="logo.png" class="logo">

<h1>
✅ Certificate Verified
</h1>

<div class="org">
Green Civic Mission 🌱
</div>

<div class="info">

<p>
Volunteer Name: <span id="name">Volunteer</span>
</p>

<p>
Certificate ID: <span id="id">GCM2026/0000</span>
</p>

<p>
Status: <span>Valid Certificate</span>
</p>

</div>

<div class="verified">

✔ Successfully Verified

</div>

<div class="footer">

Together For A Cleaner & Greener Tomorrow

</div>

</div>

<script>

/* GET URL DATA */

const params = new URLSearchParams(window.location.search);

const volunteerName = params.get("name");

const certificateId = params.get("id");

/* SHOW DATA */

if(volunteerName){

    document.getElementById("name").innerHTML = volunteerName;

}

if(certificateId){

    document.getElementById("id").innerHTML = certificateId;

}

</script>

</body>

</html>
